name: AI Hub Deployment
run-name: 'AI Hub Deployment: `${{ inputs.LANDING_ZONE }}` to `${{ inputs.ENVIRONMENT }}` - Action: `${{ inputs.ACTION }}`'
on:
  workflow_dispatch:
    inputs:
      LANDING_ZONE:
        type: choice
        required: true
        options:
        - aihub
        - aiservices
        - aiapps
     
      ACTION:
        type: choice
        required: true
        description: 'Select the action to perform'
        options:
        - deploy
        - destroy
        default: deploy
 
      moduleversion:
        type: choice
        required: true
        options:
        #- v1.0.0
        #- v1.0.1
        - v1.1.3
        #- v1.1.0
        #- v1.1.0-beta    
 
      ENVIRONMENT:
        type: choice
        required: true
        options:
        - dev
        - qa
        - uat
        - preprod
        - sit
 
      AUTO_CLEANUP_STATE:
        type: boolean
        required: false
        description: 'Automatically clean up deleted resources from Terraform state'
        default: true
 
permissions:
  packages: write # Allow github.token to write packages
  id-token: write
 
jobs:
  Approval-CloudOps:
    if: inputs.ENVIRONMENT == 'dev' && inputs.ACTION == 'deploy'
    runs-on: ubuntu-latest
    environment: approval-cloudOps
    steps:
    - name: Approval CloudOps
      if: needs.Approval-CloudOps.result == 'failure'
      run: echo 'Approvals not satisfied!' && exit 1
 
  Approval-Destroy:
    if: inputs.ACTION == 'destroy'
    runs-on: ubuntu-latest
    environment: destroy-approval
    steps:
    - name: Approval for Destroy
      run: echo 'Destroy action approved'
 
  terraform-init:
    runs-on: ubuntu-latest
    environment: "${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}"
    env:
      LANDING_ZONE: ${{ inputs.LANDING_ZONE }}
      ROOT_FOLDER_PATH: ${{ vars.ROOT_FOLDER_PATH }}
      TERRAFORM_REPOSITORY_CLONE_PATH: ${{ vars.TERRAFORM_REPOSITORY_CLONE_PATH }}
      TERRAFORM_REPOSITORY: ${{ vars.TERRAFORM_REPOSITORY }}
    steps:
    - name: CICD Bot token
      id: cicd-bot-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.CICD_BOT_APP_ID || '1137074' }}
        private-key: ${{ secrets.CICD_BOT_APP_KEY }}
        owner: ${{ github.repository_owner }}
 
    - name: CICD Bot setup
      run: |
        user_id=`gh api "/users/${{ steps.cicd-bot-token.outputs.app-slug }}[bot]" --jq .id`
        git config --global user.name '${{ steps.cicd-bot-token.outputs.app-slug }}[bot]'
        git config --global user.email "$user_id+${{ steps.cicd-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com"
        echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV
      env:
        GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}
 
    - name: Checkout GitOps repository
      uses: actions/checkout@v4
      with:
        token: ${{ steps.cicd-bot-token.outputs.token }}
 
    - name: Checkout application repository
      id: checkout-application-repository
      uses: actions/checkout@v4
      with:
        path: ${{ env.TERRAFORM_REPOSITORY_CLONE_PATH }} # See https://github.com/actions/checkout#checkout-multiple-repos-nested
        repository: ${{ env.TERRAFORM_REPOSITORY }}
        ref: ${{ inputs.moduleversion }}
        token: ${{ steps.cicd-bot-token.outputs.token }} # Bot user token for cloning service repositories
 
    - name: Download Terraform
      run: |
        curl -Lo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.6.3/terraform_1.6.3_linux_`dpkg --print-architecture`.zip > /dev/null 2>&1
        sudo apt-get install unzip
        sudo unzip /tmp/terraform.zip -d /tmp && sudo mv /tmp/terraform /usr/local/bin && \
        sudo chmod +x /usr/local/bin/terraform
        ls -latr
        terraform --version
 
    - name: terraform init
      run: |
        # Initialize Terraform (make sure you're in the correct directory)
        cd ${{ env.ROOT_FOLDER_PATH }}
        terraform init -backend=false        
        terraform validate
 
        # Tar both the .terraform directory and .terraform.lock.hcl file
        tar -czf terraform_modules.tar.gz .terraform
        tar -czf terraform_lock.tar.gz .terraform.lock.hcl
 
    - name: Upload Artifact for terraform modules
      uses: actions/upload-artifact@v4
      with:
        name: terraform_modules
        path: ${{ env.ROOT_FOLDER_PATH }}/terraform_modules.tar.gz
        retention-days: 1
 
    - name: Upload Artifact for terraform lock
      uses: actions/upload-artifact@v4
      with:
        name: terraform_lock
        path: ${{ env.ROOT_FOLDER_PATH }}/terraform_lock.tar.gz
        retention-days: 1
 
  terraform-destroy:
    if: inputs.ACTION == 'destroy'
    runs-on: self-hosted
    needs: [terraform-init, Approval-Destroy]
    environment: "${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}"
    env:
      ROOT_FOLDER_PATH: ${{ vars.ROOT_FOLDER_PATH }}
      TFVARS_ENV: ${{ vars.TFVARS_ENV }}
      AZURE_IDENTITY: ${{ vars.AZURE_IDENTITY }}
      AZURE_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION }}
      AZURE_TENANT: ${{ vars.AZURE_TENANT }}
      TERRAFORM_REPOSITORY_CLONE_PATH: ${{ vars.TERRAFORM_REPOSITORY_CLONE_PATH }}
      TERRAFORM_REPOSITORY: ${{ vars.TERRAFORM_REPOSITORY }}
    steps:
      - name: CICD Bot token
        id: cicd-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CICD_BOT_APP_ID || '1137074' }}
          private-key: ${{ secrets.CICD_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
 
      - name: CICD Bot setup
        run: |
          user_id=`gh api "/users/${{ steps.cicd-bot-token.outputs.app-slug }}[bot]" --jq .id`
          git config --global user.name '${{ steps.cicd-bot-token.outputs.app-slug }}[bot]'
          git config --global user.email "$user_id+${{ steps.cicd-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Checkout application repository
        id: checkout-application-repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.TERRAFORM_REPOSITORY_CLONE_PATH }}
          repository: ${{ env.TERRAFORM_REPOSITORY }}
          ref: ${{ inputs.moduleversion }}
          token: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Download terraform modules
        uses: actions/download-artifact@v4
        with:
          name: terraform_modules
          path: ${{ env.ROOT_FOLDER_PATH }}
 
      - name: Download terraform lock
        uses: actions/download-artifact@v4
        with:
          name: terraform_lock
          path: ${{ env.ROOT_FOLDER_PATH }}      
 
      - name: terraform extract modules
        run: |
          cd ${{ env.ROOT_FOLDER_PATH }}
          tar -xzf terraform_lock.tar.gz .terraform.lock.hcl
          tar -xzf terraform_modules.tar.gz
 
      - name: Log in with Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_IDENTITY }}
          tenant-id: ${{ env.AZURE_TENANT }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
 
      - name: terraform destroy
        run: |
          export APPSETTING_WEBSITE_SITE_NAME='azcli-workaround'
          export ARM_USE_MSI=true
          export ARM_SUBSCRIPTION_ID=${{ env.AZURE_SUBSCRIPTION }}
          export ARM_TENANT_ID=${{ env.AZURE_TENANT }}
          export ARM_CLIENT_ID=${{ env.AZURE_IDENTITY }}
          cd ${{ env.ROOT_FOLDER_PATH }}
 
          echo "Destroying all resources for the landing zone: ${{ github.event.inputs.LANDING_ZONE }}"
          terraform init -plugin-dir="$PWD/.terraform/providers" -backend-config="config/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.config"
          terraform force-unlock 6c2ff93b-74c1-32e3-c31d-cb7f2010e990
          terraform destroy -target="module.ai_search_private_endpoint" -var-file="tfvars/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.tfvars" -auto-approve
#          terraform destroy -var-file="tfvars/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.tfvars" -auto-approve
 
  terraform-plan:
    if: inputs.ACTION == 'deploy'
    runs-on: self-hosted
    needs: terraform-init
    environment: ${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}
    env:
      ROOT_FOLDER_PATH: ${{ vars.ROOT_FOLDER_PATH }}
      TFVARS_ENV: ${{ vars.TFVARS_ENV }}
      AZURE_IDENTITY: ${{ vars.AZURE_IDENTITY }}
      AZURE_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION }}
      AZURE_TENANT: ${{ vars.AZURE_TENANT }}
      TERRAFORM_REPOSITORY_CLONE_PATH: ${{ vars.TERRAFORM_REPOSITORY_CLONE_PATH }}
      TERRAFORM_REPOSITORY: ${{ vars.TERRAFORM_REPOSITORY }}          
    steps:
      - name: CICD Bot token
        id: cicd-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CICD_BOT_APP_ID || '1137074' }}
          private-key: ${{ secrets.CICD_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
 
      - name: CICD Bot setup
        run: |
          user_id=`gh api "/users/${{ steps.cicd-bot-token.outputs.app-slug }}[bot]" --jq .id`
          git config --global user.name '${{ steps.cicd-bot-token.outputs.app-slug }}[bot]'
          git config --global user.email "$user_id+${{ steps.cicd-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Checkout application repository
        id: checkout-application-repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.TERRAFORM_REPOSITORY_CLONE_PATH }} # See https://github.com/actions/checkout#checkout-multiple-repos-nested
          repository: ${{ env.TERRAFORM_REPOSITORY }}
          ref: ${{ inputs.moduleversion }}
          token: ${{ steps.cicd-bot-token.outputs.token }} # Bot user token for cloning service repositories
 
      - name: Download terraform modules
        uses: actions/download-artifact@v4
        with:
          name: terraform_modules
          path: ${{ env.ROOT_FOLDER_PATH }}
 
      - name: Download terraform lock
        uses: actions/download-artifact@v4
        with:
          name: terraform_lock
          path: ${{ env.ROOT_FOLDER_PATH }}      
 
      - name: terraform extract modules
        run: |
          cd ${{ env.ROOT_FOLDER_PATH }}
          tar -xzf terraform_lock.tar.gz .terraform.lock.hcl
          tar -xzf terraform_modules.tar.gz
 
      - name: Log in with Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_IDENTITY }}
          tenant-id: ${{ env.AZURE_TENANT }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
 
      - name: Create state cleanup script
        run: |
          cd ${{ env.ROOT_FOLDER_PATH }}
          cat > cleanup_state.sh << 'EOF'
          #!/bin/bash
   
          # Function to safely remove resources from state if they exist
          remove_if_exists() {
          local resource="$1"
          echo "🔍 Checking if $resource exists in state..."
     
          # Check if resource exists in state (handle both exact match and pattern match)
          local exact_match=$(terraform state list 2>/dev/null | grep -E "^${resource}$" || true)
          local pattern_match=$(terraform state list 2>/dev/null | grep -E "^${resource//\[/\\[}" | head -1 || true)
     
          if [[ -n "$exact_match" ]]; then
            echo "🗑️ Removing exact match: $exact_match from state..."
            terraform state rm "$exact_match" 2>/dev/null || echo "⚠️ Failed to remove $exact_match, continuing..."
          elif [[ -n "$pattern_match" ]]; then
            echo "🗑️ Removing pattern match: $pattern_match from state..."
            terraform state rm "$pattern_match" 2>/dev/null || echo "⚠️ Failed to remove $pattern_match, continuing..."
          else
            echo "✅ Resource pattern $resource not found in state, skipping..."
          fi
          }
   
          # Function to remove all variations of a resource
          remove_all_variations() {
          local base_resource="$1"
          echo "🔍 Looking for all variations of: $base_resource"
     
          # Get all matching resources
          local matching_resources=$(terraform state list 2>/dev/null | grep -E "^${base_resource}" || true)
     
          if [[ -n "$matching_resources" ]]; then
            echo "Found matching resources:"
            echo "$matching_resources"
            while IFS= read -r resource; do
              if [[ -n "$resource" ]]; then
                echo "🗑️ Removing: $resource"
                terraform state rm "$resource" 2>/dev/null || echo "⚠️ Failed to remove $resource, continuing..."
              fi
            done <<< "$matching_resources"
          else
            echo "✅ No matching resources found for: $base_resource"
          fi
          }
 
          # Function to extract deleted resources from plan output
          extract_deleted_resources() {
            local plan_output="$1"
            echo "$plan_output" | grep -E "^\s*#.*has been deleted$" | sed 's/^.*# //' | sed 's/ has been deleted$//' || true
          }
 
          # Function to clean up known problematic resources
          cleanup_common_resources() {
            echo "🧹 Cleaning up commonly deleted resources..."
 
            # List of base resource patterns that are commonly deleted manually
            local common_resource_patterns=(
              "module.ai_search.azurerm_search_service.search_service"
              "module.ai_search_private_endpoint.azurerm_private_endpoint.ai_search_pe"
              "module.cosmosdb.azurerm_cosmosdb_account.cosmosdb_account"
              "module.key_vault.azurerm_key_vault.this"
              "module.resource_group_services.azurerm_resource_group.rg"
              "module.storage.azurerm_user_assigned_identity.sa_managed_identity"
              "module.key_vault.azurerm_role_assignment.kv_enc_officer"
              "module.storage.data.azurerm_key_vault.keyvault"
              "module.ai_foundry.azapi_resource.account"
            )
 
            for pattern in "${common_resource_patterns[@]}"; do
              remove_all_variations "$pattern"
            done
          }
   
          # Function to clean up resources found in plan
          cleanup_detected_resources() {
            local deleted_resources="$1"
            if [[ -n "$deleted_resources" ]]; then
              echo "🔍 Found deleted resources in plan output:"
              echo "$deleted_resources"
              echo ""
              echo "🧹 Cleaning up detected resources..."
              while IFS= read -r resource; do
                if [[ -n "$resource" ]]; then
                  remove_all_variations "$resource"
                fi
              done <<< "$deleted_resources"
            else
              echo "✅ No deleted resources detected in plan output"
            fi
          }
 
          # Main cleanup function
          main() {
            echo "🚀 Starting Terraform state cleanup..."
 
            # Initialize terraform first to access state
            echo "🔧 Initializing Terraform..."
            terraform init -plugin-dir="$PWD/.terraform/providers" -backend-config="config/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.config" > /dev/null 2>&1 || {
              echo "❌ Failed to initialize Terraform"
              return 1
            }
 
            echo "📋 Current Terraform state resources:"
            terraform state list
            echo ""
 
            # Always clean up common resources first
            cleanup_common_resources
 
            # If plan output is provided, clean up detected resources
            if [[ -n "$1" ]]; then
              local deleted_resources
              deleted_resources=$(extract_deleted_resources "$1")
              cleanup_detected_resources "$deleted_resources"
            fi
 
            echo "State cleanup completed"
            echo "Remaining resources in state:"
            terraform state list
          }
   
          main "$@"
          EOF
   
          chmod +x cleanup_state.sh
 
        # Update your "Initial terraform plan and state drift detection" step:
      - name: Initial terraform plan and state drift detection
        id: initial_plan
        run: |
          export APPSETTING_WEBSITE_SITE_NAME='azcli-workaround'
          export ARM_USE_MSI=true
          export ARM_SUBSCRIPTION_ID=${{ env.AZURE_SUBSCRIPTION }}
          export ARM_TENANT_ID=${{ env.AZURE_TENANT }}
          export ARM_CLIENT_ID=${{ env.AZURE_IDENTITY }}
          cd ${{ env.ROOT_FOLDER_PATH }}
     
          echo "Deploying all resources for the landing zone: ${{ github.event.inputs.LANDING_ZONE }}"
           
         
          # Initialize terraform first
          terraform init -plugin-dir="$PWD/.terraform/providers" -backend-config="config/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.config"
          
          # Run initial plan and capture output
          echo "Running initial terraform plan..."
          set +e  # Don't exit on error
          terraform plan -var-file="tfvars/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.tfvars" > plan_output.txt 2>&1
          plan_exit_code=$?
          set -e  # Re-enable exit on error
         
          # Check if there are objects changed outside Terraform
          if grep -q "Objects have changed outside of Terraform" plan_output.txt; then
            echo "State drift detected! Objects have been changed outside of Terraform."
            echo "state_drift_detected=true" >> $GITHUB_OUTPUT
           
            # Save plan output for cleanup script
            cat plan_output.txt > plan_with_drift.txt
          else
            echo "No state drift detected."
            echo "state_drift_detected=false" >> $GITHUB_OUTPUT
          fi
         
          # Always show the plan output (truncated for readability)
          echo "Plan Output (first 100 lines):"
          head -100 plan_output.txt
         
          # If plan failed for reasons other than state drift, we should know
          if [ $plan_exit_code -ne 0 ]; then
            echo "Terraform plan exited with code: $plan_exit_code"
          fi
 
      - name: Clean up Terraform state (if drift detected)
        if: steps.initial_plan.outputs.state_drift_detected == 'true' && inputs.AUTO_CLEANUP_STATE == true
        run: |
          export APPSETTING_WEBSITE_SITE_NAME='azcli-workaround'
          export ARM_USE_MSI=true
          export ARM_SUBSCRIPTION_ID=${{ env.AZURE_SUBSCRIPTION }}
          export ARM_TENANT_ID=${{ env.AZURE_TENANT }}
          export ARM_CLIENT_ID=${{ env.AZURE_IDENTITY }}
          cd ${{ env.ROOT_FOLDER_PATH }}
         
          echo "Cleaning up Terraform state due to detected drift..."
         
          # Run cleanup script with plan output
          if [[ -f plan_with_drift.txt ]]; then
            ./cleanup_state.sh "$(cat plan_with_drift.txt)"
          else
            ./cleanup_state.sh
          fi
 
      - name: Final terraform plan (after cleanup)
        run: |
          export APPSETTING_WEBSITE_SITE_NAME='azcli-workaround'
          export ARM_USE_MSI=true
          export ARM_SUBSCRIPTION_ID=${{ env.AZURE_SUBSCRIPTION }}
          export ARM_TENANT_ID=${{ env.AZURE_TENANT }}
          export ARM_CLIENT_ID=${{ env.AZURE_IDENTITY }}
          cd ${{ env.ROOT_FOLDER_PATH }}
         
          echo "Running final terraform plan..."
          terraform plan -var-file="tfvars/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.tfvars" -out=plan.tfout
         
          # Show plan summary
          echo "Plan Summary:"
          terraform show -no-color plan.tfout | head -50
 
      - name: Upload terraform plan
        if: inputs.ACTION == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: terraform_plan
          path: ${{ env.ROOT_FOLDER_PATH }}/plan.tfout
          retention-days: 1
 
      - name: Upload cleanup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup_logs
          path: |
            ${{ env.ROOT_FOLDER_PATH }}/plan_output.txt
            ${{ env.ROOT_FOLDER_PATH }}/plan_with_drift.txt
          retention-days: 7
 
  terraform-apply:
    if: inputs.ACTION == 'deploy'
    runs-on: self-hosted
    needs: [terraform-plan, Approval-CloudOps]
    environment: "${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}"
    env:
      ROOT_FOLDER_PATH: ${{ vars.ROOT_FOLDER_PATH }}
      TFVARS_ENV: ${{ vars.TFVARS_ENV }}
      AZURE_IDENTITY: ${{ vars.AZURE_IDENTITY }}
      AZURE_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION }}
      AZURE_TENANT: ${{ vars.AZURE_TENANT }}
      TERRAFORM_REPOSITORY_CLONE_PATH: ${{ vars.TERRAFORM_REPOSITORY_CLONE_PATH }}
      TERRAFORM_REPOSITORY: ${{ vars.TERRAFORM_REPOSITORY }}
    steps:
      - name: CICD Bot token
        id: cicd-bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CICD_BOT_APP_ID || '1137074' }}
          private-key: ${{ secrets.CICD_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
 
      - name: CICD Bot setup
        run: |
          user_id=`gh api "/users/${{ steps.cicd-bot-token.outputs.app-slug }}[bot]" --jq .id`
          git config --global user.name '${{ steps.cicd-bot-token.outputs.app-slug }}[bot]'
          git config --global user.email "$user_id+${{ steps.cicd-bot-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          echo "GH_TOKEN=$GH_TOKEN" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.cicd-bot-token.outputs.token }}
 
      - name: Checkout application repository
        id: checkout-application-repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.TERRAFORM_REPOSITORY_CLONE_PATH }} # See https://github.com/actions/checkout#checkout-multiple-repos-nested
          repository: ${{ env.TERRAFORM_REPOSITORY }}
          ref: ${{ inputs.moduleversion }}
          token: ${{ steps.cicd-bot-token.outputs.token }} # Bot user token for cloning service repositories
 
      - name: Download terraform modules
        uses: actions/download-artifact@v4
        with:
          name: terraform_modules
          path: ${{ env.ROOT_FOLDER_PATH }}
 
      - name: Download terraform lock
        uses: actions/download-artifact@v4
        with:
          name: terraform_lock
          path: ${{ env.ROOT_FOLDER_PATH }}      
 
      - name: Download terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform_plan
          path: ${{ env.ROOT_FOLDER_PATH }}      
 
      - name: terraform extract modules
        run: |
          cd ${{ env.ROOT_FOLDER_PATH }}
          tar -xzf terraform_lock.tar.gz .terraform.lock.hcl
          tar -xzf terraform_modules.tar.gz
          ls -latr
 
      - name: Log in with Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_IDENTITY }}
          tenant-id: ${{ env.AZURE_TENANT }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION }}
 
      - name: terraform apply
        run: |
          export APPSETTING_WEBSITE_SITE_NAME='azcli-workaround'
          export ARM_USE_MSI=true
          export ARM_SUBSCRIPTION_ID=${{ env.AZURE_SUBSCRIPTION }}
          export ARM_TENANT_ID=${{ env.AZURE_TENANT }}
          export ARM_CLIENT_ID=${{ env.AZURE_IDENTITY }} # only necessary for user assigned identity
          cd ${{ env.ROOT_FOLDER_PATH }}
 
          echo "Deploying all resources for the landing zone: ${{ github.event.inputs.LANDING_ZONE }}"
          terraform init -plugin-dir="$PWD/.terraform/providers" -backend-config="config/${{ github.event.inputs.LANDING_ZONE }}-${{ github.event.inputs.ENVIRONMENT }}.config"
          terraform apply -auto-approve plan.tfout
         
          echo "Deployment completed successfully!"
